<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Becario del Universo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Oficina cósmica: noche de tinta, papel de memorándum y sellos de caucho.
     Una sola columna vertical dibujada entera en canvas; el sello gigante es el único grito. */
  --tinta:#14163a;
  --tinta-2:#262a6e;
  --fondo:#0b0c22;
  --papel:#f6ecd2;
  --carpeta:#f2c14e;
  --sello:#ff4b3e;
  --visto:#5fe3c0;
  --lila:#9d8cff;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-memo:"Courier Prime","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--fondo);overflow:hidden;overscroll-behavior:none}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none;cursor:pointer}
canvas:focus-visible{outline:3px solid var(--carpeta);outline-offset:-3px}
</style>
</head>
<body>
<canvas id="juego" tabindex="0" aria-label="Becario del Universo: juego de microtareas cósmicas. Toca la pantalla o pulsa Espacio para empezar."></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('juego'), ctx=cv.getContext('2d');
const css=getComputedStyle(document.documentElement), tk=(n,d)=>(css.getPropertyValue(n)||'').trim()||d;
const C={ink:tk('--tinta','#14163a'),ink2:tk('--tinta-2','#262a6e'),out:tk('--fondo','#0b0c22'),paper:tk('--papel','#f6ecd2'),
  gold:tk('--carpeta','#f2c14e'),red:tk('--sello','#ff4b3e'),mint:tk('--visto','#5fe3c0'),lila:tk('--lila','#9d8cff')};
const FD=tk('--f-display','"Bungee","Arial Black",Impact,sans-serif'), FM=tk('--f-memo','"Courier Prime","Courier New",monospace');
const TAU=Math.PI*2, W=400;
let H=720, sc=1, ox=0, oy=0, vw=0, vh=0, dpr=1, T=0;
const TOP=112, BOT=()=>H-58, MID=()=>(TOP+BOT())/2;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x2-x1,y2-y1);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const hex=c=>{const n=parseInt(c.slice(1),16);return[n>>16,n>>8&255,n&255];};
const mix=(a,b,t)=>{const A=hex(a),B=hex(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';};

function resize(){
  vw=cv.clientWidth||window.innerWidth||400; vh=cv.clientHeight||window.innerHeight||700;
  const asp=clamp(vh/vw,1.45,2.3);
  H=Math.round(W*asp); sc=Math.min(vw/W,vh/H); ox=(vw-W*sc)/2; oy=(vh-H*sc)/2;
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(vw*dpr); cv.height=Math.round(vh*dpr);
}
window.addEventListener('resize',resize); resize();

/* ---------- dibujo ---------- */
function circ(x,y,r,fill,stroke,lw=4){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function rr(x,y,w,h,r,fill,stroke,lw=4){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();}}
function line(x1,y1,x2,y2,col,lw=4){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();}
const fontOf=(size,o)=>o&&o.mono?((o.it?'italic ':'')+(o.b?'700 ':'400 ')+size+'px '+FM):(size+'px '+FD);
function txt(s,x,y,size,color,o={}){
  s=String(s);ctx.font=fontOf(size,o);
  if(o.max){const w=ctx.measureText(s).width;if(w>o.max){size=size*o.max/w;ctx.font=fontOf(size,o);}}
  ctx.textAlign=o.align||'center';ctx.textBaseline='middle';
  if(o.stroke){ctx.lineWidth=o.sw||8;ctx.strokeStyle=o.stroke;ctx.lineJoin='round';ctx.strokeText(s,x,y);}
  ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function wrap(s,maxW,size,o){ctx.font=fontOf(size,o);const out=[];let cur='';for(const w of String(s).split(' ')){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;}else cur=t;}if(cur)out.push(cur);return out;}
function star(x,y,r,fill,stroke,lw=3,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<10;i++){const q=i%2?r*.46:r,a=rot+i*Math.PI/5;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.stroke();}}
function face(x,y,s,mood,col=C.out){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(2.5,s*.085);ctx.lineCap='round';
  const ex=s*.36,ey=-s*.12,er=s*.11;
  for(const k of[-1,1]){
    ctx.beginPath();
    if(mood==='sleep')ctx.arc(k*ex,ey,er*1.3,.15*Math.PI,.85*Math.PI);
    else if(mood==='happy')ctx.arc(k*ex,ey+er*.6,er*1.3,1.15*Math.PI,1.85*Math.PI);
    else if(mood==='dead'){ctx.moveTo(k*ex-er,ey-er);ctx.lineTo(k*ex+er,ey+er);ctx.moveTo(k*ex+er,ey-er);ctx.lineTo(k*ex-er,ey+er);}
    else{ctx.arc(k*ex,ey,er,0,TAU);ctx.fill();ctx.beginPath();if(mood==='angry'){ctx.moveTo(k*(ex-er*1.8),ey-er*2.4);ctx.lineTo(k*(ex+er*1.2),ey-er*1.2);}}
    ctx.stroke();
  }
  ctx.beginPath();
  if(mood==='happy')ctx.arc(0,s*.16,s*.3,.12*Math.PI,.88*Math.PI);
  else if(mood==='sad'||mood==='dead'||mood==='angry')ctx.arc(0,s*.56,s*.26,1.2*Math.PI,1.8*Math.PI);
  else if(mood==='o'){ctx.arc(0,s*.34,s*.12,0,TAU);ctx.fill();ctx.beginPath();}
  else if(mood==='sleep')ctx.arc(0,s*.32,s*.07,0,TAU);
  else{ctx.moveTo(-s*.16,s*.32);ctx.lineTo(s*.16,s*.32);}
  ctx.stroke();ctx.restore();
}
function planet(x,y,r,col,style=0){
  if(r<=.5)return;
  const ring=(a,b)=>{ctx.save();ctx.translate(x,y);ctx.rotate(-.3);ctx.beginPath();ctx.ellipse(0,0,r*1.75,r*.45,0,a,b);ctx.strokeStyle=C.out;ctx.lineWidth=r*.34;ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,r*1.75,r*.45,0,a,b);ctx.strokeStyle=C.gold;ctx.lineWidth=r*.17;ctx.stroke();ctx.restore();};
  if(style===2)ring(Math.PI,TAU);
  circ(x,y,r,col,C.out,Math.max(3,r*.09));
  ctx.save();ctx.beginPath();ctx.arc(x,y,Math.max(.1,r-1.5),0,TAU);ctx.clip();
  ctx.fillStyle='rgba(11,12,34,.2)';
  if(style===1)for(let i=0;i<3;i++)ctx.fillRect(x-r,y-r*.62+i*r*.52,r*2,r*.2);
  if(style===3){circ(x-r*.34,y-r*.22,r*.22,'rgba(11,12,34,.2)');circ(x+r*.3,y+r*.34,r*.16,'rgba(11,12,34,.2)');circ(x+r*.28,y-r*.42,r*.11,'rgba(11,12,34,.2)');}
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.arc(x-r*.3,y-r*.3,r*1.02,0,TAU);ctx.fillStyle='rgba(11,12,34,.22)';ctx.fill('evenodd');
  ctx.restore();
  if(style===2)ring(0,Math.PI);
}
const STARS=Array.from({length:64},()=>({x:Math.random(),y:Math.random(),r:rnd(.6,1.9),p:rnd(TAU)}));
function drawStars(a=1){ctx.fillStyle=C.paper;for(const s of STARS){ctx.globalAlpha=a*(reduce?.7:.5+.4*Math.sin(T*1.6+s.p));ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;}

/* ---------- partículas ---------- */
const parts=[];
function burst(x,y,n,cols,sp=280,life=.7){if(reduce)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(.3,1)*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rnd(.6,1),m:life,c:pick(cols),r:rnd(3,7),g:320});}}
function confetti(){const n=reduce?8:28;for(let i=0;i<n;i++)parts.push({x:rnd(W),y:rnd(-40,-5),vx:rnd(-60,60),vy:rnd(140,380),l:1.3,m:1.3,c:pick([C.gold,C.mint,C.lila,C.red,C.paper]),r:rnd(4,7),g:180,sq:1});}

/* ---------- sonido ---------- */
let AC=null,master=null,muted=false,noiseBuf=null;
function audioInit(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();master.gain.value=muted?0:.55;master.connect(AC.destination);
      noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function tone(f,d,type='square',vol=.12,when=0,to=0){
  if(!AC||muted)return;
  try{const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}catch(e){}
}
function noise(d,vol=.2,when=0){
  if(!AC||muted||!noiseBuf)return;
  try{const t=AC.currentTime+when,s=AC.createBufferSource(),g=AC.createGain();s.buffer=noiseBuf;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);}catch(e){}
}
const SCALE=[0,2,4,7,9,12,14,16];
const sfx={
  tap:(f=620)=>tone(f,.06,'square',.09),
  note:i=>tone(392*Math.pow(2,SCALE[clamp(i-1,0,7)]/12),.16,'triangle',.24),
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.13,'square',.11,i*.07)),
  fail:()=>{tone(233,.55,'sawtooth',.15,0,52);noise(.4,.22);},
  tick:()=>tone(1500,.025,'square',.06),
  cmd:()=>{tone(784,.08,'square',.1);tone(1175,.13,'square',.1,.09);},
  stamp:()=>{tone(120,.14,'sine',.5,0,45);noise(.07,.28);},
  gulp:()=>tone(440,.2,'sine',.3,0,90),
  splat:()=>{noise(.12,.3);tone(190,.1,'square',.14,0,60);},
  fast:()=>[392,494,587,784,988].forEach((f,i)=>tone(f,.1,'square',.1,i*.08)),
  over:()=>[392,370,349,330,196].forEach((f,i)=>tone(f,.26,'triangle',.2,i*.2)),
  paper:()=>noise(.18,.12),
};
const BASS=[0,0,7,0,3,0,7,10];
let musT=0,musStep=0,musRoot=0,musOn=false;
function music(){
  const on=(state==='prompt'||state==='play')&&AC&&!muted;
  if(!on){musOn=false;return;}
  if(!musOn){musOn=true;musT=AC.currentTime+.03;musStep=0;}
  const step=60/Math.min(205,128+10*lvl)/2;
  let guard=0;
  while(musT<AC.currentTime+.12&&guard++<8){
    const when=Math.max(0,musT-AC.currentTime);
    tone(98*Math.pow(2,(musRoot+BASS[musStep%8])/12),step*.85,'square',.055,when);
    if(musStep%2)noise(.03,.05,when);
    musT+=step;musStep++;
  }
}

/* ---------- estado ---------- */
let state='title',st=0,score=0,lives=4,lvl=0,played=0,best=0,newBest=false;
let G=null,def=null,bag=[],memo=null,stamp=null,shake=0,flash=0,promptDur=1;
const P={x:W/2,y:300,down:false,touch:false};
try{best=parseInt(localStorage.getItem('becario-record'))||0;}catch(e){}

const WIN=['APROBADO','CORRECTO','COSMOS OK','CONFORME','BIEN HECHO'];
const LOSE=['DENEGADO','CATÁSTROFE','APOCALIPSIS','A RR. HH.','SINIESTRO'];
const PRISAS=[
  'MÁS RÁPIDO. El universo no se gestiona solo.',
  'Vas bien. No te lo creas.',
  'Las horas extra se pagan en polvo de estrellas. Acelera.',
  'Hay una galaxia esperando en la cola. Espabila.',
  'Preguntan por ti los de Recursos Cósmicos. Corre.',
  'He visto supernovas más lentas que tú. Venga.'];
const RANGOS=[[0,'Becario en prácticas (sin remunerar)'],[3,'Auxiliar de constelaciones'],[7,'Técnico de gravedad'],[12,'Subdeidad adjunta'],[18,'Demiurgo junior'],[26,'Arquitecto del cosmos'],[40,'Jefe. Ahora el café lo pides tú.']];
const NOTAS=['El universo ha sido devuelto al fabricante.','Se han perdido un par de galaxias. Nadie las usaba.','Aceptable. El cosmos sigue más o menos donde estaba.','Notable. Hasta la gravedad te hace caso.','El Jefe pregunta si quieres su puesto. Es una trampa.'];

function setState(s){state=s;st=0;}
function startGame(){score=0;lives=4;lvl=0;played=0;bag=[];newBest=false;parts.length=0;
  showMemo('Me bajo a por un café. Vuelvo en 13.800 millones de años. Haz TODO lo que salga en pantalla. Rápido. Y no rompas nada.',5.5);}
function showMemo(text,dur){memo={text,dur,n:lvl+1};setState('memo');sfx.paper();}
function nextTask(){
  if(!bag.length)bag=shuffle(GAMES.slice());
  def=bag.pop();
  const f=Math.max(.58,1-.08*lvl);
  G={t:0,rt:0,lvl,dur:def.time*f,done:null,tick:0};
  def.init(G);
  musRoot=pick([0,2,3,5,7]);promptDur=Math.max(.8,1.15*f);stamp=null;
  setState('prompt');sfx.cmd();
}
const textOf=v=>typeof v==='function'?v(G):v;
function win(){if(state!=='play')return;G.done='win';score++;stamp={t:pick(WIN),ok:true,hit:false};setState('result');sfx.win();confetti();}
function fail(){if(state!=='play')return;G.done='fail';lives--;stamp={t:pick(LOSE),ok:false,hit:false};setState('result');sfx.fail();shake=16;flash=1;}
function afterResult(){
  played++;
  if(lives<=0){if(score>best){best=score;newBest=true;try{localStorage.setItem('becario-record',String(best));}catch(e){}}setState('over');sfx.over();return;}
  if(played%5===0){lvl++;showMemo(PRISAS[(lvl-1)%PRISAS.length],2.6);sfx.fast();}
  else nextTask();
}

/* ---------- las 13 tareas ---------- */
function dino(x,y,s){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);const g='#7bd66b';
  ctx.beginPath();ctx.moveTo(-9,-12);ctx.lineTo(-30,-3);ctx.lineTo(-8,-2);ctx.closePath();ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=C.out;ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
  rr(-8,-4,6,9,2,g,C.out,3);rr(3,-4,6,9,2,g,C.out,3);
  ctx.beginPath();ctx.ellipse(0,-11,13,10,0,0,TAU);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=C.out;ctx.lineWidth=3;ctx.stroke();
  rr(5,-36,10,24,5,g,C.out,3);rr(5,-43,23,14,6,g,C.out,3);circ(20,-37,2.2,C.out);
  ctx.restore();
}
const FORMS=['Permiso para que exista el martes','Solicitud de un 12 % más de gravedad','Renovación del contrato de la Luna','Alta de un color nuevo (provisional)','Baja voluntaria de Plutón','Reclamación: el tiempo va en un solo sentido'];
const CONST=['LA CROQUETA','EL CARRITO DEL SÚPER','EL CALCETÍN PERDIDO','LA GRAPADORA','EL LUNES','LA SARTÉN MENOR'];

const GAMES=[
{id:'sol',cmd:'¡ENCIENDE EL SOL!',hint:'toca muy rápido',time:4.6,bg:'#2b1d52',
  init(g){g.e=0;g.pop=0;},
  down(g){g.e=Math.min(1,g.e+.085);g.pop=1;sfx.tap(300+g.e*520);},
  update(g,dt){g.pop=Math.max(0,g.pop-dt*6);if(!g.done){g.e=Math.max(0,g.e-.1*dt);if(g.e>=1)win();}},
  draw(g){
    const x=W/2,y=MID(),on=g.done==='win',e=on?1:g.e,R=78*(1+g.pop*.06);
    drawStars(.5);
    for(let i=0;i<12;i++){const lit=on||i<Math.floor(e*12+.001);ctx.save();ctx.translate(x,y);ctx.rotate(i/12*TAU+(on&&!reduce?T*.9:0));rr(-9,-R-48-(lit?5*Math.sin(T*9+i):0),18,34,9,lit?C.gold:'#463a78',C.out,4);ctx.restore();}
    circ(x,y,R,mix('#5b4d8f','#ffc93c',e),C.out,5);
    face(x,y,R,on?'happy':e>.55?'o':'sleep');
    if(!on&&e<.55)for(let i=0;i<3;i++){const k=(T*.5+i/3)%1;ctx.globalAlpha=1-k;txt('Z',x+R*.75+k*36,y-R*.8-k*56,14+k*14,C.paper);ctx.globalAlpha=1;}
  }},

{id:'boton',cmd:g=>g.inv?'¡AHORA SÍ: PULSA EL BOTÓN!':'¡NO TOQUES EL BOTÓN!',hint:g=>g.inv?'esta vez va en serio':'ni se te ocurra',time:3.6,bg:'#262a6e',
  init(g){g.inv=g.lvl>=1&&Math.random()<.38;g.y=MID()+16;g.r=66;g.press=0;},
  down(g,x,y){if(dist(x,y,W/2,g.y)<g.r+8){g.press=1;if(g.inv)win();else{burst(W/2,g.y,40,[C.paper,C.gold,C.red],520,.9);fail();}}},
  update(g,dt){if(!g.done)g.r=66+(g.inv?0:Math.min(1,g.t/g.dur)*30)+(reduce?0:3*Math.sin(T*10));},
  timeout:g=>!g.inv,
  draw(g){
    const x=W/2,y=g.y;
    ctx.save();ctx.beginPath();ctx.rect(0,TOP-52,W,BOT()-TOP+52);ctx.clip();
    ctx.strokeStyle='rgba(242,193,78,.16)';ctx.lineWidth=22;for(let i=-H;i<W+H;i+=64){ctx.beginPath();ctx.moveTo(i,BOT());ctx.lineTo(i+H*.6,TOP-52);ctx.stroke();}
    ctx.restore();
    rr(x-104,y-150,208,46,8,C.gold,C.out,5);txt('BIG BANG 2',x,y-126,22,C.out);
    ctx.beginPath();ctx.ellipse(x,y+26,g.r+26,(g.r+26)*.42,0,0,TAU);ctx.fillStyle='#3b3f8f';ctx.fill();ctx.strokeStyle=C.out;ctx.lineWidth=5;ctx.stroke();
    const dy=g.press?12:0;
    circ(x,y+dy,g.r,g.press?'#b82a22':C.red,C.out,6);
    ctx.beginPath();ctx.ellipse(x-g.r*.3,y+dy-g.r*.42,g.r*.3,g.r*.14,-.5,0,TAU);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill();
    const B=g.inv?['MEJOR NO','QUITA','NO ME TOQUES','AY']:['PÚLSAME','NADIE MIRA','SOLO UNA VEZ','VENGA'];
    const pos=[[92,y-64],[310,y-48],[84,y+112],[314,y+120]];
    for(let i=0;i<4;i++)if(g.t>.25+i*.5||g.done){const[bx,by]=pos[i];ctx.save();ctx.translate(bx,by);ctx.rotate((i%2?.1:-.1)+(reduce?0:.04*Math.sin(T*6+i)));rr(-66,-17,132,34,17,C.paper,C.out,4);txt(B[i],0,1,14,C.out,{max:114});ctx.restore();}
    if(g.done==='win'&&!g.inv)txt('QUÉ ABURRIDO ERES',x,BOT()-22,15,C.paper,{stroke:C.out,sw:6});
  }},

{id:'asteroide',cmd:'¡ESPANTA AL ASTEROIDE!',hint:'agárralo y lánzalo lejos',time:5,bg:'#14163a',

function toLocal(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left-ox)/sc,(e.clientY-r.top-oy)/sc];}
function advance(){
  audioInit();
  if(state==='title'){startGame();return true;}
  if(state==='memo'&&st>.45){nextTask();return true;}
  if(state==='over'&&st>.9){startGame();return true;}
  return false;
}
cv.addEventListener('pointerdown',e=>{
  if(e.isPrimary===false)return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const[x,y]=toLocal(e);P.x=x;P.y=y;P.down=true;P.touch=e.pointerType==='touch';
  if(x>W-56&&y<58&&x<=W&&y>=0){audioInit();muted=!muted;if(master)master.gain.value=muted?0:.55;if(!muted)sfx.tap();return;}
  if(advance())return;
  if(state==='play'&&def.down)def.down(G,x,y);
});
cv.addEventListener('pointermove',e=>{
  if(e.isPrimary===false)return;const[x,y]=toLocal(e);P.x=x;P.y=y;
  if(P.down&&state==='play'&&def.move)def.move(G,x,y);
});
function release(e){
  if(e.isPrimary===false)return;const[x,y]=toLocal(e);P.down=false;
  if(G&&def&&def.up&&(state==='play'||state==='result'))def.up(G,x,y);
}

function update(dt){
  T+=dt;st+=dt;
  shake*=Math.pow(.0008,dt);flash=Math.max(0,flash-dt*2.6);
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  music();
  if(state==='memo'){if(st>memo.dur)nextTask();}
  else if(state==='prompt'){if(st>promptDur)setState('play');}
  else if(state==='play'){
    G.t+=dt;if(def.update)def.update(G,dt);
    if(state==='play'){
      const left=G.dur-G.t;
      if(left<1.6){G.tick-=dt;if(G.tick<=0){G.tick=left<.7?.1:.2;sfx.tick();}}
      if(left<=0){if(def.timeout&&def.timeout(G))win();else fail();}
    }
  }
  else if(state==='result'){
    G.rt+=dt;if(def.update)def.update(G,dt);
    if(stamp&&!stamp.hit&&st>.16){stamp.hit=true;sfx.stamp();shake=Math.max(shake,7);}
    if(st>1.2)afterResult();
  }
}

  ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);drawStars(1);
  const k=clamp(st/.45,0,1),e=reduce?1:1-Math.pow(1-k,3);
  let rango=RANGOS[0][1];for(const[r,n]of RANGOS)if(score>=r)rango=n;
  const nota=NOTAS[score<3?0:score<8?1:score<14?2:score<24?3:4];
  const rl=wrap(rango,270,21),nl=wrap(nota,284,15,{mono:1,it:1}),h=258+rl.length*26+nl.length*20;
  sheet(348,h,lerp(H+20,H*.45-h/2,e),.02,(x,w)=>{
    txt('INFORME DE EVALUACIÓN',x,32,17,C.out,{align:'left',max:w});
    txt('BECARIO: TÚ · TURNO: ETERNO',x,58,13,C.ink2,{mono:1,b:1,align:'left'});
    line(x,74,x+w,74,C.out,2);
    txt('Tareas resueltas',x,100,15,C.out,{mono:1,align:'left'});txt(score,x+w,102,34,C.out,{align:'right'});
    txt(newBest?'¡Récord nuevo!':'Récord personal',x,134,15,newBest?C.red:C.out,{mono:1,b:newBest,align:'left'});txt(best,x+w,134,20,C.out,{align:'right'});
    line(x,154,x+w,154,C.out,2);
    txt('RANGO ASIGNADO:',x,176,13,C.ink2,{mono:1,b:1,align:'left'});
    rl.forEach((l,i)=>txt(l,x,204+i*26,21,C.ink2,{align:'left',max:w}));
    const ny=214+rl.length*26;
    nl.forEach((l,i)=>txt(l,x,ny+i*20,15,C.out,{mono:1,it:1,align:'left'}));
    if(st>.7){const ok=score>=12,c=ok?'#178a6a':C.red,t=ok?'RENOVADO':'DESPEDIDO';
      ctx.save();ctx.translate(x+w-84,h-36);ctx.rotate(-.2);rr(-84,-22,168,44,8,null,c,4);txt(t,0,2,21,c,{max:150});ctx.restore();}
  });
  if(st>.9){ctx.globalAlpha=reduce?.9:.6+.4*Math.sin(T*5);txt('TOCA PARA VOLVER A FICHAR',W/2,H-48,16,C.gold,{max:370});ctx.globalAlpha=1;}
}
function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=C.out;ctx.fillRect(0,0,vw,vh);
  ctx.save();
  let sx=0,sy=0;if(shake>.4&&!reduce){sx=rnd(-shake,shake);sy=rnd(-shake,shake);}
  ctx.translate(ox+sx*sc,oy+sy*sc);ctx.scale(sc,sc);
  ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  if(state==='title')drawTitle();else if(state==='memo')drawMemo();else if(state==='over')drawOver();else drawGame();
  for(const p of parts){ctx.globalAlpha=clamp(p.l/p.m*1.6,0,1);ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(p.x-p.r,p.y-p.r*.6,p.r*2,p.r*1.2);else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle='rgba(255,75,62,'+(flash*(reduce?.15:.4))+')';ctx.fillRect(0,0,W,H);}
  drawSound();
  ctx.restore();
}
let last=0;
function frame(now){
  const dt=last?Math.min(.05,(now-last)/1000):0;last=now;
  try{update(dt);render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}

/* ---------- arranque ---------- */
function start(d){
  d=d||{};
  if(typeof d.best==='number'&&d.best>best)best=d.best;
  if(d.lives>0&&typeof d.score==='number'){score=d.score;lives=d.lives;lvl=d.lvl||0;played=d.played||0;showMemo('Seguimos donde lo dejaste. El universo no se ha arreglado solo.',2.6);}
  try{if(document.fonts&&document.fonts.load){document.fonts.load('40px Bungee');document.fonts.load('700 16px "Courier Prime"');document.fonts.load('italic 400 16px "Courier Prime"');document.fonts.load('400 16px "Courier Prime"');}}catch(e){}
  requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>({best,score:(state==='title'||state==='over')?null:score,lives,lvl,played}));
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>
